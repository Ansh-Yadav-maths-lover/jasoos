<!DOCTYPE html><html><head><meta charset="utf-8"><title>JASOOS trailer</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#07040d;color:#eee;font-family:system-ui,sans-serif;display:flex;
    flex-direction:column;align-items:center;gap:12px;padding:12px}
  canvas{border-radius:10px;box-shadow:0 20px 60px -20px #000;background:#07040d}
  button{padding:14px 26px;border-radius:12px;border:0;background:#f5b83d;color:#2a1600;font-weight:800;font-size:18px}
  #st{font:14px monospace;color:#9c8fbb}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<button id="go">RECORD TRAILER</button>
<div id="st">idle</div>
<script>
const C=document.getElementById('c'), X=C.getContext('2d'), ST=document.getElementById('st');
const W=1280,H=720;
const GOLD='#f5b83d', GOLD2='#ffd98a', ROSE='#e0457b', TEAL='#22b8a6', INK='#0b0713', DIM='#b6a7d3';
const cl=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
const eo=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
const ei=t=>Math.max(0,Math.min(1,t))**2;
const eb=t=>{t=Math.max(0,Math.min(1,t));const c=1.70158+1;return 1+c*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2)};
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);
  X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function txt(s,x,y,{size=40,weight=800,font='Baloo 2',fill='#fff',align='center',base='middle',glow=0,gc=GOLD,alpha=1,ls=0}={}){
  X.save();X.globalAlpha=alpha;X.font=`${weight} ${size}px "${font}", system-ui, sans-serif`;
  X.textAlign=align;X.textBaseline=base;X.fillStyle=fill;
  if(glow){X.shadowColor=gc;X.shadowBlur=glow;}
  if(ls){ // manual letter-spacing
    const chars=[...s]; let tot=0; chars.forEach(ch=>tot+=X.measureText(ch).width+ls); tot-=ls;
    let cx = align==='center'? x-tot/2 : align==='right'? x-tot : x; X.textAlign='left';
    chars.forEach(ch=>{X.fillText(ch,cx,y);cx+=X.measureText(ch).width+ls;});
  } else X.fillText(s,x,y);
  X.restore();
}
function grad(y0,y1,c0,c1){const g=X.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g;}
/* ---------- background ---------- */
const petals=Array.from({length:26},(_,i)=>({x:Math.random(),y:Math.random(),r:5+Math.random()*15,
  sp:.1+Math.random()*.4,ph:Math.random()*7,a:.04+Math.random()*.09,g:Math.random()<.45}));
function bg(t){
  X.fillStyle=INK;X.fillRect(0,0,W,H);
  let g=X.createRadialGradient(W*.5,-60,0,W*.5,-60,W*.85);
  g.addColorStop(0,'rgba(120,30,90,.55)');g.addColorStop(1,'rgba(8,4,16,0)');X.fillStyle=g;X.fillRect(0,0,W,H);
  g=X.createRadialGradient(W*.5,H+80,0,W*.5,H+80,W*.7);
  g.addColorStop(0,'rgba(245,184,61,.20)');g.addColorStop(1,'rgba(8,4,16,0)');X.fillStyle=g;X.fillRect(0,0,W,H);
  petals.forEach(p=>{
    const y=((p.y - t*p.sp*.05)%1+1)%1, px=(p.x+Math.sin(y*7+p.ph)*.02)*W, py=y*H;
    X.save();X.globalAlpha=p.a;X.translate(px,py);X.rotate(t*.4+p.ph);
    if(p.g){X.fillStyle=GOLD;X.beginPath();
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2;X.ellipse(Math.cos(a)*p.r*.6,Math.sin(a)*p.r*.6,p.r*.42,p.r*.26,a,0,7);}
      X.fill();}
    else{X.strokeStyle=ROSE;X.lineWidth=1.1;X.beginPath();X.arc(0,0,p.r,0,7);X.stroke();
      X.beginPath();X.arc(0,0,p.r*.45,0,7);X.stroke();}
    X.restore();
  });
  X.fillStyle='rgba(0,0,0,.35)';
  const v=X.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.95);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.72)');X.fillStyle=v;X.fillRect(0,0,W,H);
}
function mandala(cx,cy,R,rot,alpha,color=GOLD){
  X.save();X.translate(cx,cy);X.rotate(rot);X.globalAlpha=alpha;X.strokeStyle=color;X.fillStyle=color;
  for(let ring=0;ring<4;ring++){
    const r=R*(.22+ring*.22), n=8+ring*6;
    X.lineWidth=R*.004;X.beginPath();X.arc(0,0,r,0,7);X.stroke();
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2;X.beginPath();
      X.arc(Math.cos(a)*r,Math.sin(a)*r,R*(.021-ring*.003),0,7);X.fill();}
  }
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;X.beginPath();X.moveTo(0,0);
    X.quadraticCurveTo(Math.cos(a-.18)*R*.7,Math.sin(a-.18)*R*.7,Math.cos(a)*R*.94,Math.sin(a)*R*.94);
    X.quadraticCurveTo(Math.cos(a+.18)*R*.7,Math.sin(a+.18)*R*.7,0,0);X.lineWidth=R*.0035;X.stroke();}
  X.restore();
}
/* ---------- pieces ---------- */
function logo(cx,cy,size,alpha=1,glow=26){
  X.save();X.globalAlpha=alpha;
  X.font=`800 ${size}px "Baloo 2", system-ui, sans-serif`;X.textAlign='center';X.textBaseline='middle';
  const g=X.createLinearGradient(0,cy-size*.6,0,cy+size*.6);
  g.addColorStop(0,'#fff6dd');g.addColorStop(.45,GOLD);g.addColorStop(1,'#c9821a');
  X.shadowColor='rgba(245,184,61,.55)';X.shadowBlur=glow;X.fillStyle=g;
  const s='JASOOS'; const chars=[...s]; let tot=0; const ls=size*.09;
  chars.forEach(ch=>tot+=X.measureText(ch).width+ls); tot-=ls;
  let x=cx-tot/2; X.textAlign='left';
  chars.forEach(ch=>{X.fillText(ch,x,cy);x+=X.measureText(ch).width+ls;});
  X.restore();
}
function lens(cx,cy,r,alpha=1,rot=0){
  X.save();X.globalAlpha=alpha;X.translate(cx,cy);X.rotate(rot);
  X.strokeStyle=GOLD;X.lineWidth=r*.19;X.lineCap='round';
  X.beginPath();X.arc(0,0,r,0,7);X.stroke();
  X.beginPath();X.moveTo(r*.72,r*.72);X.lineTo(r*1.7,r*1.7);X.lineWidth=r*.26;X.stroke();
  X.fillStyle=ROSE;X.beginPath();X.arc(0,0,r*.42,0,7);X.fill();
  X.fillStyle='rgba(255,255,255,.8)';X.beginPath();X.arc(-r*.16,-r*.16,r*.13,0,7);X.fill();
  X.restore();
}
function card(cx,cy,w,h,{rot=0,kind='civ',word='',role='',note='',alpha=1,flip=1,scale=1}={}){
  X.save();X.globalAlpha=alpha;X.translate(cx,cy);X.rotate(rot);X.scale(Math.max(.02,flip)*scale,scale);
  const spy=kind==='spy', back=kind==='back';
  const g=X.createLinearGradient(-w/2,-h/2,w/2,h/2);
  if(back){g.addColorStop(0,'#2c1b45');g.addColorStop(1,'#150d24');}
  else if(spy){g.addColorStop(0,'#4a0f28');g.addColorStop(1,'#1b0a16');}
  else{g.addColorStop(0,'#0f3b3a');g.addColorStop(1,'#0c1a24');}
  X.shadowColor='rgba(0,0,0,.8)';X.shadowBlur=44;X.shadowOffsetY=18;
  X.fillStyle=g;rr(-w/2,-h/2,w,h,26);X.fill();X.shadowBlur=0;X.shadowOffsetY=0;
  X.strokeStyle=back?'rgba(245,184,61,.35)':(spy?'rgba(224,69,123,.75)':'rgba(34,184,166,.65)');
  X.lineWidth=2.4;rr(-w/2,-h/2,w,h,26);X.stroke();
  X.save();rr(-w/2,-h/2,w,h,26);X.clip();
  mandala(0,0,w*.72,0,back?.16:.11,back?GOLD:(spy?ROSE:TEAL));
  X.restore();
  if(flip>.55){
    if(back){ txt('?',0,-8,{size:w*.42,fill:GOLD,glow:18}); txt('JASOOS?',0,h*.3,{size:w*.1,fill:DIM,ls:w*.02}); }
    else{
      txt(role,0,-h*.22,{size:w*.088,fill:spy?'#ff8fb4':'#5fe3d0',ls:w*.025,weight:700});
      txt(word,0,-h*.02,{size:word.length>10?w*.13:w*.165,fill:'#fff'});
      if(note) txt(note,0,h*.22,{size:w*.072,font:'Mukta',weight:600,fill:spy?'#e3a2ba':'#9fd9d0'});
    }
  }
  X.restore();
}
function chip(x,y,label,{fill='rgba(245,184,61,.16)',stroke='rgba(245,184,61,.4)',color=GOLD,size=22,pad=16,alpha=1}={}){
  X.save();X.globalAlpha=alpha;X.font=`600 ${size}px "Mukta", system-ui, sans-serif`;
  const w=X.measureText(label).width+pad*2, h=size*1.9;
  X.fillStyle=fill;rr(x-w/2,y-h/2,w,h,h/2);X.fill();X.strokeStyle=stroke;X.lineWidth=1.4;X.stroke();
  X.fillStyle=color;X.textAlign='center';X.textBaseline='middle';X.fillText(label,x,y+1);X.restore();
  return w;
}
function bubble(x,y,w,h,{who='',clue='',alpha=1,slide=0,hot=false}={}){
  X.save();X.globalAlpha=alpha;X.translate(slide,0);
  X.fillStyle=hot?'rgba(224,69,123,.14)':'rgba(255,255,255,.055)';
  rr(x,y,w,h,18);X.fill();
  X.strokeStyle=hot?'rgba(224,69,123,.55)':'rgba(255,255,255,.09)';X.lineWidth=1.5;rr(x,y,w,h,18);X.stroke();
  X.fillStyle='rgba(255,255,255,.07)';rr(x+14,y+h/2-21,42,42,13);X.fill();
  txt(who.slice(0,2),x+35,y+h/2,{size:20,font:'Mukta',weight:700,fill:'#d9c9f5'});
  txt(who,x+70,y+h*.34,{size:16,font:'Mukta',weight:600,fill:DIM,align:'left'});
  txt(clue,x+70,y+h*.68,{size:27,fill:'#fff',align:'left'});
  X.restore();
}
/* ================= SCENES ================= */
const SEQ=[];
const scene=(dur,fn)=>SEQ.push({dur,fn});
const NAMES=['Rahul','Priya','Bunty','Pinky','Guddu'];
const CLUES=['batata','tapri','mumbai','…tasty','pav'];
const SPY=3;

/* 1. title -------------------------------------------------- 0 .. 4.4 */
scene(4.4,t=>{
  bg(t);
  mandala(W/2,H*.46,H*.62,t*.12,cl(0,.2,t/1.6));
  const dl=eb((t-.15)/.9);
  lens(W/2-4,cl(-140,196,dl),44,cl(0,1,t/.5),cl(-.6,0,dl));
  const ls=eb((t-.75)/.85);
  if(t>.75) logo(W/2,H*.5-6,cl(40,116,ls),cl(0,1,(t-.75)/.5),34);
  if(t>1.35) txt('जासूस',W/2,H*.5+74,{size:30,font:'Mukta',weight:600,fill:GOLD2,alpha:cl(0,.95,(t-1.35)/.6)});
  if(t>1.55) txt('THE DESI IMPOSTER PARTY GAME',W/2,H*.5+114,{size:21,font:'Mukta',weight:600,fill:GOLD2,
    ls:6,alpha:cl(0,.85,(t-1.55)/.6)});
  if(t>2.0){
    const a=cl(0,1,(t-2.0)/.55);
    X.save();X.globalAlpha=a*.55;X.strokeStyle=GOLD;X.lineWidth=1.5;
    const w=cl(0,420,eo((t-2.0)/.9));
    X.beginPath();X.moveTo(W/2-w/2,H*.5+150);X.lineTo(W/2+w/2,H*.5+150);X.stroke();X.restore();
  }
  if(t>2.5) txt('Ek shabd.  Sab jhooth.  Ek jasoos.',W/2,H*.5+194,
    {size:36,fill:'#fff',alpha:cl(0,1,(t-2.5)/.6),glow:12,gc:'rgba(224,69,123,.6)'});
});
/* 2. deal the cards ---------------------------------------- 4.4 .. 10.2 */
scene(5.8,t=>{
  bg(t+4);
  mandala(W/2,H*.5,H*.68,-t*.08,.09);
  txt('Sabko ek hi secret word milta hai…',W/2,86,{size:40,fill:'#fff',alpha:cl(0,1,t/.5)});
  for(let i=0;i<5;i++){
    const st=.35+i*.17, a=cl(0,1,(t-st)/.3);
    if(a<=0) continue;
    const p=eb((t-st)/.85);
    const tx=cl(W/2,224+i*208,p), ty=cl(H+180,H*.53,p), rot=cl(.5,(i-2)*.062,p);
    const ft=t-(1.9+i*.16);
    const flip=ft<0?1:(ft<.22?Math.abs(Math.cos(ft/.22*Math.PI/2)):Math.min(1,(ft-.22)/.22));
    const shown=ft>.22;
    const spy=i===SPY;
    card(tx,ty,190,272,{rot,alpha:a,flip:Math.max(.04,flip),
      kind: shown?(spy?'spy':'civ'):'back',
      role: spy?'JASOOS':'NAGRIK', word: spy?'?':'Vada Pav', note: spy?'kuch nahi pata':'tum jaante ho'});
    if(shown) txt(NAMES[i],tx,ty+168,{size:22,font:'Mukta',weight:600,fill:DIM,alpha:cl(0,1,(ft-.3)/.4)});
  }
  if(t>4.0) txt('… ek ko nahi.',W/2,H-56,{size:44,fill:ROSE,alpha:cl(0,1,(t-4.0)/.5),glow:22,gc:ROSE});
});
/* 3. clues -------------------------------------------------- 10.2 .. 17.4 */
scene(7.2,t=>{
  bg(t+10);
  txt('Bari-bari se ek shabd ka clue.',W/2,74,{size:40,fill:'#fff',alpha:cl(0,1,t/.4)});
  txt('Nagrik saabit karo. Jasoos, bluff maaro.',W/2,120,{size:24,font:'Mukta',weight:600,fill:DIM,alpha:cl(0,1,(t-.3)/.5)});
  for(let i=0;i<5;i++){
    const st=.75+i*.95, a=cl(0,1,(t-st)/.35);
    if(a<=0) continue;
    const slide=cl(-70,0,eo((t-st)/.5));
    const spy=i===SPY;
    let clue=CLUES[i];
    if(spy){ const w=t-st; clue = w<1.15? '…' : 'tasty'; }
    bubble(258,172+i*92,764,76,{who:NAMES[i],clue,alpha:a,slide,hot:spy&&t-st>1.15});
    if(spy&&t-st>1.35) txt('shak!',1050,172+i*92+38,{size:26,fill:ROSE,alpha:cl(0,1,(t-st-1.35)/.4),glow:14,gc:ROSE});
  }
  if(t>6.1) txt('Kaun bol raha hai jhooth?',W/2,H-40,{size:34,fill:GOLD,alpha:cl(0,1,(t-6.1)/.5)});
});
/* 4. vote --------------------------------------------------- 17.4 .. 23.4 */
scene(6.0,t=>{
  const shake=t>2.85&&t<3.4? Math.sin((t-2.85)*70)*(1-(t-2.85)/.55)*9 : 0;
  X.save();X.translate(shake,0);
  bg(t+17);
  txt('Sab milkar vote karo.',W/2,80,{size:42,fill:'#fff',alpha:cl(0,1,t/.4)});
  const votes=[0,1,0,4,0];
  for(let i=0;i<5;i++){
    const y=160+i*96, spy=i===SPY, a=cl(0,1,(t-.2-i*.08)/.35);
    X.save();X.globalAlpha=a;
    const hot=spy&&t>1.7;
    X.fillStyle=hot?'rgba(224,69,123,.18)':'rgba(255,255,255,.05)';rr(292,y,700,74,18);X.fill();
    X.strokeStyle=hot?'rgba(224,69,123,.7)':'rgba(255,255,255,.08)';X.lineWidth=hot?2.2:1.4;rr(292,y,700,74,18);X.stroke();
    X.fillStyle='rgba(255,255,255,.07)';rr(306,y+15,44,44,13);X.fill();
    txt(NAMES[i].slice(0,2),328,y+37,{size:20,font:'Mukta',weight:700,fill:'#d9c9f5'});
    txt(NAMES[i],366,y+38,{size:28,fill:'#fff',align:'left'});
    for(let v=0;v<votes[i];v++){
      const vt=t-(.9+v*.19+i*.05); if(vt<0) continue;
      const s=eb(vt/.3);
      X.save();X.globalAlpha=Math.min(1,s);X.fillStyle=GOLD;
      X.beginPath();X.arc(700+v*44,y+37,13*s,0,7);X.fill();
      X.fillStyle='#2a1600';X.font='700 15px "Mukta"';X.textAlign='center';X.textBaseline='middle';
      X.fillText('✓',700+v*44,y+38);X.restore();
    }
    X.restore();
  }
  if(t>2.85){
    const s=eb((t-2.85)/.4), a=cl(0,1,(t-2.85)/.2);
    X.save();X.globalAlpha=a*.78;X.fillStyle='#0b0713';X.fillRect(0,0,W,H);X.restore();
    X.save();X.globalAlpha=a;X.translate(W/2,H*.46);X.rotate(cl(-.5,-.09,s));X.scale(cl(2.4,1,s),cl(2.4,1,s));
    X.fillStyle='rgba(224,69,123,.16)';rr(-330,-72,660,144,26);X.fill();
    X.strokeStyle=ROSE;X.lineWidth=4;rr(-330,-72,660,144,26);X.stroke();
    txt('YEH JASOOS THA!',0,4,{size:62,fill:'#fff',glow:26,gc:ROSE});
    X.restore();
    if(t>3.25) txt('Pinky ke 4 vote.',W/2,H*.46+118,{size:32,font:'Mukta',weight:700,fill:DIM,alpha:cl(0,1,(t-3.25)/.35)});
    X.save();X.globalAlpha=Math.max(0,.45-(t-2.85));X.fillStyle=ROSE;X.fillRect(0,0,W,H);X.restore();
  }
  if(t>4.2) txt('Nagrik jeet gaye… ya nahi?',W/2,H-58,{size:36,fill:TEAL,alpha:cl(0,1,(t-4.2)/.4),glow:14,gc:TEAL});
  X.restore();
});
/* 5. the steal ---------------------------------------------- 23.4 .. 28.4 */
const conf=Array.from({length:90},()=>({x:0,y:0,vx:(Math.random()-.5)*13,vy:-4-Math.random()*11,
  r:3+Math.random()*6,c:[GOLD,ROSE,TEAL,'#fff'][Math.floor(Math.random()*4)],sp:Math.random()*7}));
scene(5.0,t=>{
  bg(t+23);
  txt('Par Jasoos ko ek aakhri mauka milta hai…',W/2,84,{size:36,fill:'#fff',alpha:cl(0,1,t/.4)});
  const opts=['Pav Bhaji','Vada Pav','Misal Pav'];
  const sel=t<1.5?-1:(t<2.0?0:1);
  opts.forEach((o,i)=>{
    const y=210+i*104, on=i===sel && t>1.9, a=cl(0,1,(t-.4-i*.12)/.35);
    X.save();X.globalAlpha=a;
    X.fillStyle=on?'rgba(245,184,61,.9)':'rgba(255,255,255,.05)';rr(390,y,500,80,20);X.fill();
    X.strokeStyle=on?'#ffdf9d':'rgba(255,255,255,.09)';X.lineWidth=on?3:1.4;rr(390,y,500,80,20);X.stroke();
    txt(o,640,y+42,{size:34,fill:on?'#2a1600':'#fff'});X.restore();
  });
  if(t>2.5){
    const a=cl(0,1,(t-2.5)/.3), s=eb((t-2.5)/.45);
    txt('SAHI GUESS!',W/2,H-150,{size:cl(30,66,s),fill:GOLD,alpha:a,glow:30});
    if(t>3.0) txt('Jasoos ne baazi palat di.',W/2,H-88,{size:34,font:'Mukta',weight:700,fill:'#fff',alpha:cl(0,1,(t-3.0)/.4)});
    const ct=t-2.5;
    conf.forEach(p=>{X.save();X.globalAlpha=Math.max(0,a-ct*.28);X.fillStyle=p.c;
      X.translate(W/2+p.vx*ct*40, H*.82+p.vy*ct*36+ct*ct*160);X.rotate(p.sp+ct*4);
      X.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.7);X.restore();});
  }
});
/* 6. end card ----------------------------------------------- 28.4 .. 33.4 */
scene(5.0,t=>{
  bg(t+28);
  mandala(W/2,H*.46,H*.7,t*.1,cl(0,.2,t/1.2));
  lens(W/2-4,168,44,cl(0,1,t/.4),0);
  logo(W/2,H*.42,cl(70,112,eb(t/.7)),cl(0,1,t/.35),36);
  txt('Ek shabd. Sab jhooth. Ek jasoos.',W/2,H*.42+92,{size:32,fill:GOLD2,alpha:cl(0,1,(t-.4)/.4)});
  if(t>.8){
    const a=cl(0,1,(t-.8)/.4);
    let labels=['3–12 khiladi','Ek phone ya sabke phone','346 desi shabd'];
    const ws=labels.map(l=>{X.font='600 22px "Mukta"';return X.measureText(l).width+32;});
    const tot=ws.reduce((x,y)=>x+y,0)+24*2; let x=W/2-tot/2;
    labels.forEach((l,i)=>{ chip(x+ws[i]/2,H*.63,l,{alpha:a}); x+=ws[i]+24; });
  }
  if(t>1.4){
    const a=cl(0,1,(t-1.4)/.4);
    txt('jasoos.games.bu.app',W/2,H*.78,{size:52,fill:'#fff',alpha:a,glow:18});
    txt('free · no install · khelo abhi',W/2,H*.78+52,{size:24,font:'Mukta',weight:600,fill:DIM,alpha:a});
  }
  if(t>4.4){X.fillStyle=`rgba(0,0,0,${cl(0,1,(t-4.4)/.6)})`;X.fillRect(0,0,W,H);}
});
const TOTAL=SEQ.reduce((a,s)=>a+s.dur,0);
function drawAt(time){
  let t=time;
  for(const s of SEQ){ if(t<s.dur){ s.fn(t); break; } t-=s.dur; }
  if(time<.45){X.fillStyle=`rgba(0,0,0,${1-time/.45})`;X.fillRect(0,0,W,H);}
}
/* ================= AUDIO ================= */
let AC=null, MASTER=null, DEST=null;
function audioInit(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  MASTER=AC.createGain(); MASTER.gain.value=.9;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-14; comp.ratio.value=4;
  MASTER.connect(comp);
  DEST=AC.createMediaStreamDestination();
  comp.connect(DEST); comp.connect(AC.destination);
}
const noiseBuf=(dur=.4)=>{ const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; };
let NB=null;
function kick(t,g=1){
  const o=AC.createOscillator(), a=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+.13);
  a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(.9*g,t+.008); a.gain.exponentialRampToValueAtTime(.001,t+.34);
  o.connect(a).connect(MASTER); o.start(t); o.stop(t+.36);
}
function tabla(t,f=340,g=.5,dur=.16){          // dry "na/tin" hit
  const o=AC.createOscillator(), a=AC.createGain(), b=AC.createBiquadFilter();
  o.type='triangle'; o.frequency.setValueAtTime(f*1.5,t); o.frequency.exponentialRampToValueAtTime(f,t+.05);
  b.type='bandpass'; b.frequency.value=f*2.2; b.Q.value=2.5;
  a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(g,t+.005); a.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(b).connect(a).connect(MASTER); o.start(t); o.stop(t+dur+.02);
  const n=AC.createBufferSource(), na=AC.createGain(), nb=AC.createBiquadFilter();
  n.buffer=NB; nb.type='highpass'; nb.frequency.value=2600;
  na.gain.setValueAtTime(g*.5,t); na.gain.exponentialRampToValueAtTime(.001,t+.05);
  n.connect(nb).connect(na).connect(MASTER); n.start(t); n.stop(t+.07);
}
function drone(t,dur){
  [55,82.5].forEach((f,i)=>{
    const o=AC.createOscillator(), a=AC.createGain(), lp=AC.createBiquadFilter();
    o.type=i?'triangle':'sawtooth'; o.frequency.value=f;
    lp.type='lowpass'; lp.frequency.value=260;
    a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(i?.05:.085,t+1.2);
    a.gain.setValueAtTime(i?.05:.085,t+dur-2); a.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(lp).connect(a).connect(MASTER); o.start(t); o.stop(t+dur+.1);
  });
}
function note(t,f,dur=.34,g=.16,type='triangle'){
  const o=AC.createOscillator(), a=AC.createGain(), lp=AC.createBiquadFilter();
  o.type=type; o.frequency.setValueAtTime(f,t);
  const lfo=AC.createOscillator(), lg=AC.createGain();
  lfo.frequency.value=5.5; lg.gain.value=f*.007; lfo.connect(lg).connect(o.frequency); lfo.start(t); lfo.stop(t+dur+.1);
  lp.type='lowpass'; lp.frequency.value=2600;
  a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(g,t+.02);
  a.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(lp).connect(a).connect(MASTER); o.start(t); o.stop(t+dur+.05);
}
function whoosh(t,g=.35){
  const n=AC.createBufferSource(), a=AC.createGain(), bp=AC.createBiquadFilter();
  n.buffer=NB; bp.type='bandpass'; bp.Q.value=1.1;
  bp.frequency.setValueAtTime(280,t); bp.frequency.exponentialRampToValueAtTime(4200,t+.4);
  a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(g,t+.12); a.gain.exponentialRampToValueAtTime(.001,t+.5);
  n.connect(bp).connect(a).connect(MASTER); n.start(t); n.stop(t+.55);
}
function stamp(t){
  kick(t,1.3); tabla(t,180,.7,.3);
  const o=AC.createOscillator(), a=AC.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(90,t+.5);
  a.gain.setValueAtTime(.28,t); a.gain.exponentialRampToValueAtTime(.001,t+.6);
  o.connect(a).connect(MASTER); o.start(t); o.stop(t+.62);
}
function shimmer(t){
  [880,1320,1760,2640].forEach((f,i)=>note(t+i*.07,f,.9,.075,'sine'));
}
/* raga-flavoured motif (D minor pentatonic-ish) */
const D=146.83, sc=[0,2,3,5,7,10,12].map(s=>D*Math.pow(2,s/12));
const RIFF=[0,2,3,2,4,3,2,0], RIFF2=[4,5,4,3,2,3,2,0];
function schedule(t0){
  NB=noiseBuf(.5);
  const bpm=104, beat=60/bpm;                  // 0.577s
  drone(t0,TOTAL);
  for(let b=0;b*beat<TOTAL-.4;b++){
    const t=t0+b*beat, bar=Math.floor(b/4), inBar=b%4;
    const vote=t-t0>=17.4&&t-t0<23.4, quiet=(t-t0)<1.2;
    if(quiet) continue;
    if(inBar===0) kick(t,vote?1.1:.9);
    if(inBar===2) kick(t,.7);
    tabla(t+beat*.5,vote?300:360,vote?.42:.3,.14);
    if(inBar===1||inBar===3) tabla(t,520,.22,.1);
    if(inBar===3) tabla(t+beat*.75,660,.18,.08);
  }
  // melody enters with the cards, drops out for the vote, returns for the finale
  for(let b=0;b*beat<TOTAL-1;b++){
    const t=t0+b*beat, rel=b*beat;
    if(rel<4.2||(rel>16.9&&rel<23.2)) continue;
    const riff=(Math.floor(b/8)%2)?RIFF2:RIFF, deg=riff[b%8];
    const oct=rel>28?2:1;
    note(t,sc[deg]*oct,beat*.9,rel>28?.15:.12,'triangle');
    if(rel>23.4&&rel<28.4) note(t+beat*.5,sc[(deg+2)%7]*2,beat*.45,.07,'sine');
  }
  // accents at scene changes
  [0,4.4,10.2,17.4,23.4,28.4].forEach(s=>whoosh(t0+s,s===0?.5:.3));
  stamp(t0+17.4+2.85);
  shimmer(t0+23.4+2.5);
  shimmer(t0+28.4+.1);
  note(t0+.15,sc[0],1.6,.2,'triangle');
}
/* ================= RECORD ================= */
async function record(){
  ST.textContent='loading fonts…';
  try{ await document.fonts.load('800 100px "Baloo 2"'); await document.fonts.load('600 24px "Mukta"');
    await document.fonts.ready; }catch(e){}
  audioInit(); await AC.resume();
  const vs=C.captureStream(30);
  const stream=new MediaStream([...vs.getVideoTracks(), ...DEST.stream.getAudioTracks()]);
  let rec=null, mime='';
  for(const m of ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1.4d002a,mp4a.40.2','video/mp4',
                  'video/webm;codecs=vp9,opus','video/webm']){
    try{ rec=new MediaRecorder(stream,{mimeType:m,videoBitsPerSecond:6_000_000,audioBitsPerSecond:128_000});
      mime=rec.mimeType||m; break; }catch(e){}
  }
  if(!rec) throw new Error('no recorder mime');
  ST.textContent='recorder: '+mime;
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const done=new Promise(r=>rec.onstop=r);
  drawAt(0);
  rec.start();                                  // single fragment
  const t0=AC.currentTime+.12;
  schedule(t0);
  const start=performance.now()+120;
  await new Promise(res=>{
    function loop(now){
      const t=(now-start)/1000;
      if(t>=TOTAL){ res(); return; }
      drawAt(Math.max(0,t));
      ST.textContent='recording '+t.toFixed(1)+' / '+TOTAL.toFixed(1)+'s';
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  });
  await new Promise(r=>setTimeout(r,260));
  rec.stop(); await done;
  const blob=new Blob(chunks,{type:mime.split(';')[0]});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='jasoos_trailer.'+(mime.includes('mp4')?'mp4':'webm');
  document.body.appendChild(a); a.click();
  ST.textContent='done: '+a.download+' · '+(blob.size/1048576).toFixed(2)+' MB · '+mime;
  window.__trailerDone={size:blob.size,mime,name:a.download,total:TOTAL};
}
document.getElementById('go').onclick=()=>record().catch(e=>{ST.textContent='ERR '+e.message;});

document.fonts.ready.then(()=>drawAt(30.2));
window.__preview=s=>{drawAt(s);return 'drew '+s};
</script></body></html>
